<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моят Flipbook с PDF</title>

    <!-- 1. CSS (онлайн връзки) -->
    <link href="https://cdn.jsdelivr.net/npm/dflip@1.0.0/css/dflip.min.css" rel="stylesheet" type="text/css">
    <link href="https://cdn.jsdelivr.net/npm/dflip@1.0.0/css/themify-icons.min.css" rel="stylesheet" type="text/css">
</head>
<body>
    <!-- 2. Мястото, където ще се появи книгата -->
    <!-- В "source" сложете пътя до вашия PDF файл -->
    <div class="_df_book" source="nematdes-3.pdf"></div>

    <!-- 3. Скриптове (онлайн връзки) - сложете ги преди затварянето на </body> -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/dflip@1.0.0/js/dflip.min.js" type="text/javascript"></script>
</body>
</html>
