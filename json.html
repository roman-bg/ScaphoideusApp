<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <title>Температури през CORS прокси</title>
    <style>
        /* CSS стилове - същите като горните */
    </style>
</head>
<body>
    <div class="remote-card">
        <h2>Сума на ефективни температури</h2>
        <div id="data-container">
            <p id="loading">Зареждане...</p>
        </div>
    </div>

    <script>
        const API_URL = 'http://87.254.182.122/effective_temperature_sum.json';

        // Безплатни CORS проксита (изберете едно)
        const PROXIES = [
            'https://api.allorigins.win/raw?url=',
            'https://cors-anywhere.herokuapp.com/',
            'https://crossorigin.me/'
        ];

        async function loadData() {
            try {
                // Опит с първото прокси
                const response = await fetch(PROXIES[0] + encodeURIComponent(API_URL));

                if (!response.ok) throw new Error('HTTP грешка');

                const data = await response.json();

                document.getElementById('loading').textContent =
                    `Сума: ${data.effective_temperature_sum}°C (${data.timestamp})`;

            } catch (error) {
                document.getElementById('loading').textContent =
                    'Грешка при зареждане: ' + error.message;
            }
        }

        loadData();
    </script>
</body>
</html>
