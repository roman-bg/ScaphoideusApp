<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сума на ефективни температури</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(145deg, #2b5876 0%, #4e4376 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #2c3e50;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .badge {
            background: linear-gradient(145deg, #667eea, #764ba2);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
        }

        .temperature-container {
            background: linear-gradient(145deg, #667eea, #764ba2);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 25px;
            text-align: center;
            color: white;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .temperature-label {
            font-size: 16px;
            opacity: 0.9;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .temperature-value {
            font-size: 80px;
            font-weight: 800;
            line-height: 1;
            margin: 15px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .temperature-unit {
            font-size: 24px;
            opacity: 0.9;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .info-item {
            background: #f8fafc;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            border: 1px solid #e2e8f0;
            transition: all 0.3s ease;
        }

        .info-item:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }

        .info-icon {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .info-label {
            color: #64748b;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .info-value {
            color: #2c3e50;
            font-size: 20px;
            font-weight: 600;
        }

        .timestamp {
            background: #2c3e50;
            color: white;
            padding: 18px;
            border-radius: 12px;
            text-align: center;
            font-size: 14px;
            margin: 25px 0;
            word-break: break-word;
        }

        .refresh-btn {
            background: linear-gradient(145deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .refresh-btn:active {
            transform: translateY(0);
        }

        .refresh-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin: 20px 0;
            border-left: 4px solid #c33;
            display: none;
        }

        .last-update {
            color: #94a3b8;
            font-size: 12px;
            text-align: center;
            margin-top: 15px;
        }

        .auto-refresh-badge {
            background: #10b981;
            color: white;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 10px;
            margin-left: 10px;
        }

        @media (max-width: 500px) {
            .card {
                padding: 20px;
            }
            
            .temperature-value {
                font-size: 60px;
            }
            
            .info-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h1>🌡 Ефективни температури</h1>
            <span class="badge">实时 данни от сензори</span>
        </div>

        <!-- Loading State -->
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Зареждане на данни от сензорите...</p>
            <small>Свързване със сървър 87.254.182.122</small>
        </div>

        <!-- Error State -->
        <div id="error" class="error-message"></div>

        <!-- Content State -->
        <div id="content" style="display: none;">
            <div class="temperature-container">
                <div class="temperature-label">Сума на ефективни температури</div>
                <div class="temperature-value">
                    <span id="sum-value">0</span>
                </div>
                <div class="temperature-unit" id="unit">°C</div>
            </div>

            <div class="info-grid">
                <div class="info-item">
                    <div class="info-icon">🎯</div>
                    <div class="info-label">Базова температура</div>
                    <div class="info-value" id="base-temp">10 °C</div>
                </div>
                <div class="info-item">
                    <div class="info-icon">📡</div>
                    <div class="info-label">Сървър</div>
                    <div class="info-value">87.254.182.122</div>
                </div>
            </div>

            <div class="timestamp" id="timestamp">
                Зареждане...
            </div>

            <button class="refresh-btn" onclick="loadData(true)" id="refreshBtn">
                <span>🔄</span> Обнови данните
                <span class="auto-refresh-badge">авто 30s</span>
            </button>

            <div class="last-update" id="last-update">
                Автоматично обновяване на всеки 30 секунди
            </div>
        </div>
    </div>

    <script>
        // Конфигурация
        const API_URL = 'http://87.254.182.122/effective_temperature_sum.json';
        const PROXY = 'https://api.allorigins.win/raw?url=';
        
        let autoRefreshInterval;
        let isRefreshing = false;

        // Функция за форматиране на timestamp
        function formatTimestamp(timestamp) {
            if (!timestamp) return 'Няма информация';
            
            try {
                // Опитваме да парснем датата
                const date = new Date(timestamp);
                if (isNaN(date.getTime())) return timestamp;
                
                return date.toLocaleString('bg-BG', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });
            } catch (e) {
                return timestamp;
            }
        }

        // Основна функция за зареждане на данни
        async function loadData(manual = false) {
            // Предпазваме от multiple requests
            if (isRefreshing) return;
            
            isRefreshing = true;
            const refreshBtn = document.getElementById('refreshBtn');
            if (refreshBtn) refreshBtn.disabled = true;

            // Показваме loading само при първо зареждане
            if (!manual && document.getElementById('content').style.display === 'none') {
                document.getElementById('loading').style.display = 'block';
            }
            
            try {
                const url = PROXY + encodeURIComponent(API_URL + '?t=' + Date.now());
                
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const data = await response.json();
                
                // Валидация на данните
                if (!data || typeof data.effective_temperature_sum === 'undefined') {
                    throw new Error('Невалидни данни от сървъра');
                }
                
                // Обновяване на UI
                updateUI(data);
                
                // Скриваме loading и error, показваме content
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'none';
                document.getElementById('content').style.display = 'block';
                
                // Показваме съобщение при ръчно обновяване
                if (manual) {
                    showTemporaryMessage('Данните са обновени ✓', 'success');
                }
                
            } catch (error) {
                console.error('Грешка:', error);
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').innerHTML = `
                    <strong>❌ Грешка при комуникация</strong><br>
                    ${error.message}<br>
                    <small style="display: block; margin-top: 10px;">
                        Сървър: 87.254.182.122<br>
                        Прокси: allorigins.win
                    </small>
                `;
                
                if (manual) {
                    showTemporaryMessage('Грешка при обновяване', 'error');
                }
            } finally {
                isRefreshing = false;
                if (refreshBtn) refreshBtn.disabled = false;
            }
        }

        // Функция за обновяване на UI
        function updateUI(data) {
            // Форматиране на числата
            const sumValue = parseFloat(data.effective_temperature_sum).toFixed(2);
            const baseTemp = parseFloat(data.base_temperature).toFixed(1);
            
            // Анимация на числото (ако се е променило)
            animateValue('sum-value', sumValue);
            
            document.getElementById('sum-value').textContent = sumValue;
            document.getElementById('unit').textContent = data.unit || '°C';
            document.getElementById('base-temp').textContent = baseTemp + ' °C';
            
            // Форматиране на timestamp
            const formattedTime = formatTimestamp(data.timestamp);
            document.getElementById('timestamp').innerHTML = `
                🕐 Последно измерване: ${formattedTime}
            `;
            
            // Запазваме в localStorage
            try {
                localStorage.setItem('lastTempData', JSON.stringify({
                    sum: sumValue,
                    timestamp: data.timestamp,
                    lastSeen: new Date().toISOString()
                }));
            } catch (e) {}
        }

        // Анимация на числото
        function animateValue(elementId, newValue) {
            const element = document.getElementById(elementId);
            const oldValue = parseFloat(element.textContent) || 0;
            
            if (oldValue !== parseFloat(newValue)) {
                element.style.transition = 'all 0.5s';
                element.style.transform = 'scale(1.1)';
                element.style.color = '#10b981';
                
                setTimeout(() => {
                    element.style.transform = 'scale(1)';
                    element.style.color = '';
                }, 500);
            }
        }

        // Временни съобщения
        function showTemporaryMessage(message, type) {
            const msgDiv = document.createElement('div');
            msgDiv.textContent = message;
            msgDiv.style.cssText = `
                position: fixed;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                background: ${type === 'success' ? '#10b981' : '#ef4444'};
                color: white;
                padding: 12px 24px;
                border-radius: 8px;
                font-size: 14px;
                box-shadow: 0 4px 6px rgba(0,0,0,0.1);
                z-index: 1000;
                animation: slideUp 0.3s ease;
            `;
            
            document.body.appendChild(msgDiv);
            
            setTimeout(() => {
                msgDiv.style.animation = 'slideDown 0.3s ease';
                setTimeout(() => msgDiv.remove(), 300);
            }, 3000);
        }

        // Стилове за анимациите
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideUp {
                from { transform: translate(-50%, 100%); opacity: 0; }
                to { transform: translate(-50%, 0); opacity: 1; }
            }
            @keyframes slideDown {
                from { transform: translate(-50%, 0); opacity: 1; }
                to { transform: translate(-50%, 100%); opacity: 0; }
            }
        `;
        document.head.appendChild(style);

        // Зареждане на кеширани данни ако има
        function loadCachedData() {
            try {
                const cached = localStorage.getItem('lastTempData');
                if (cached) {
                    const data = JSON.parse(cached);
                    document.getElementById('sum-value').textContent = data.sum;
                    document.getElementById('timestamp').innerHTML = `
                        🕐 Кеширани данни от: ${formatTimestamp(data.lastSeen)}
                    `;
                }
            } catch (e) {}
        }

        // Стартиране
        document.addEventListener('DOMContentLoaded', () => {
            // Първо показваме кеширани данни (ако има)
            loadCachedData();
            
            // След това зареждаме пресни данни
            loadData(false);
            
            // Автоматично обновяване на всеки 30 секунди
            autoRefreshInterval = setInterval(() => loadData(false), 30000);
            
            // Спираме авто-обновяване когато страницата не е активна
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    clearInterval(autoRefreshInterval);
                } else {
                    loadData(false);
                    autoRefreshInterval = setInterval(() => loadData(false), 30000);
                }
            });
        });

        // Почистване
        window.addEventListener('beforeunload', () => {
            clearInterval(autoRefreshInterval);
        });
    </script>
</body>
</html>
