<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Температури</title>
</head>
<body>
    <h2>Сума на ефективни температури</h2>
    <div id="data">Зареждане...</div>

    <script>
        const API_URL = 'http://87.254.182.122/effective_temperature_sum.json';
        
        // Списък с работещи CORS проксита
        const proxies = [
            'https://corsproxy.io/?',
            'https://proxy.cors.sh/',
            'https://cors-anywhere.herokuapp.com/'
        ];
        
        async function tryProxies() {
            for (let proxy of proxies) {
                try {
                    document.getElementById('data').innerHTML = `Опит с ${proxy}...`;
                    
                    const response = await fetch(proxy + API_URL + '?t=' + Date.now());
                    
                    if (!response.ok) continue;
                    
                    const data = await response.json();
                    
                    document.getElementById('data').innerHTML = `
                        <div style="font-size: 48px;">${data.effective_temperature_sum}°C</div>
                        <div>${data.timestamp}</div>
                        <div>Базова температура: ${data.base_temperature}°C</div>
                    `;
                    return;
                } catch (e) {
                    console.log(proxy + ' не работи');
                }
            }
            
            document.getElementById('data').innerHTML = 'Всички проксита не работят. Опитайте по-късно.';
        }
        
        tryProxies();
    </script>
</body>
</html>
