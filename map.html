<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>СЕТ карантина - Свищов</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a2e28;
            color: #1a2e28;
            line-height: 1.3;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 100%;
            margin: 0;
            background: white;
            border-radius: 0;
            box-shadow: none;
            padding: 12px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* Мобилно заглавие */
        .title-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .site-logo {
            max-width: 40px;
            max-height: 40px;
            border-radius: 10px;
            border: 2px solid white;
            background: white;
            object-fit: contain;
        }

        h1 {
            font-weight: 700;
            font-size: 1.1rem;
            color: #1b4d3e;
            display: flex;
            flex-direction: column;
            margin: 0;
            line-height: 1.2;
        }

        h1 span {
            background: #ddeee5;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.6rem;
            font-weight: 500;
            color: #0f4235;
            width: fit-content;
        }

        .subtitle {
            color: #547a6a;
            font-size: 0.7rem;
            margin-bottom: 10px;
            border-left: 3px solid #9bc5b4;
            padding-left: 8px;
            font-weight: 500;
        }

        /* Легенда - хоризонтален скрол на мобилно */
        .legend {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            padding: 8px 12px;
            border-radius: 30px;
            box-shadow: 0 4px 12px rgba(0,20,10,0.1);
            display: flex;
            gap: 15px;
            overflow-x: auto;
            margin-bottom: 12px;
            border: 1px solid #d0e0d6;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            white-space: nowrap;
        }

        .legend::-webkit-scrollbar {
            display: none;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.7rem;
            font-weight: 500;
            color: #1b4d3e;
            flex-shrink: 0;
        }

        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .legend-color.point {
            background: #c0392b;
            border: 2px solid white;
            box-shadow: 0 0 0 1px #c0392b;
        }

        .legend-color.radius {
            background: rgba(224, 124, 44, 0.2);
            border: 2px solid #e07c2c;
        }

        /* Картата заема по-голяма част */
        .map-container {
            position: relative;
            width: 100%;
            height: 45vh;
            min-height: 320px;
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid #cbdcd0;
            box-shadow: 0 5px 15px rgba(20, 60, 45, 0.15);
            margin-bottom: 12px;
        }

        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Инфо карта - опростена за мобилно */
        .info-card {
            background: linear-gradient(135deg, #f0f7f3 0%, #e8f2ec 100%);
            border-radius: 20px;
            padding: 12px;
            margin-top: 0;
            border-left: 5px solid #1f7f5f;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.03);
        }

        .info-row {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.7);
            padding: 8px 12px;
            border-radius: 30px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(31,127,95,0.2);
        }

        .info-icon {
            font-size: 1.3rem;
            background: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0,40,20,0.1);
            border: 2px solid #9bc5b4;
            flex-shrink: 0;
        }

        .info-content {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .info-label {
            font-size: 0.6rem;
            color: #547a6a;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .info-value {
            font-size: 1.1rem;
            font-weight: 700;
            color: #1b4d3e;
            line-height: 1.2;
        }

        .info-value small {
            font-size: 0.7rem;
            font-weight: 400;
            color: #547a6a;
            margin-left: 3px;
        }

        /* Статус и бутон в редица */
        .action-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
        }

        .status-badge {
            background: #ecf6f0;
            border-radius: 30px;
            padding: 8px 12px;
            font-size: 0.75rem;
            color: #1b4d3e;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid #9bc5b4;
            backdrop-filter: blur(5px);
            flex: 1;
            white-space: nowrap;
        }

        .status-badge.connected {
            background: #dff0e5;
            color: #1f7f5f;
            border-color: #1f7f5f;
        }

        .status-badge.error {
            background: #ffefdb;
            color: #e07c2c;
            border-color: #e07c2c;
        }

        .refresh-btn {
            background: #1b4d3e;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s ease;
            border: 2px solid #1b4d3e;
            box-shadow: 0 3px 8px rgba(27, 77, 62, 0.2);
            flex-shrink: 0;
        }

        .refresh-btn:active {
            background: #0f3a2e;
            transform: scale(0.97);
        }

        .footer-note {
            text-align: center;
            margin-top: 15px;
            padding: 10px 5px 5px;
            border-top: 1px solid #dbd0c2;
            color: #547a6a;
            font-size: 0.7rem;
            font-weight: 500;
        }

        /* Мобилен popup */
        .custom-popup {
            border-radius: 16px;
            overflow: hidden;
        }

        .leaflet-popup-content-wrapper {
            border-radius: 16px !important;
            background: white !important;
            box-shadow: 0 5px 20px rgba(0,40,20,0.2) !important;
            border: 1px solid #9bc5b4 !important;
            padding: 0 !important;
        }

        .leaflet-popup-content {
            margin: 10px !important;
            min-width: 200px !important;
        }

        .leaflet-popup-tip {
            background: white !important;
            border: 1px solid #9bc5b4 !important;
        }

        /* Стил за временно съобщение */
        .toast-message {
            background: linear-gradient(135deg, #1f7f5f, #1b4d3e);
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 600;
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            text-align: center;
            z-index: 10000;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            animation: slideUp 0.2s ease, fadeOut 0.2s ease 2.3s forwards;
            border: 2px solid white;
        }

        .toast-message.error {
            background: linear-gradient(135deg, #e07c2c, #c0392b);
        }

        @keyframes slideUp {
            from { bottom: 10px; opacity: 0; transform: scale(0.95); }
            to { bottom: 20px; opacity: 1; transform: scale(1); }
        }

        @keyframes fadeOut {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0; transform: scale(0.9); }
        }

        /* Дребни корекции */
        .center-label {
            display: none; /* Скриваме на мобилно, за да не пречи */
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Заглавие - по-компактно -->
        <div class="title-wrapper">
            <img src="sitelogo.jpg" alt="Лого" class="site-logo" onerror="this.style.display='none'">
            <h1>
                СЕТ в карантинна зона 
                <span>Сума на ефективните температури</span>
            </h1>
        </div>

        <div class="subtitle">
            📍 Свищов (43.62°N, 25.35°E) • Радиус 2.5 км
        </div>

        <!-- Легенда с хоризонтален скрол -->
        <div class="legend">
            <div class="legend-item">
                <div class="legend-color point"></div>
                <span>🔥 Открито огнище</span>
            </div>
            <div class="legend-item">
                <div class="legend-color radius"></div>
                <span>⚠️ Карантинна зона (2.5 км)</span>
            </div>
            <div class="legend-item">
                <span>👆 Докоснете маркера</span>
            </div>
        </div>

        <!-- Карта -->
        <div class="map-container">
            <div id="map"></div>
        </div>

        <!-- Информационен панел - опростен за мобилно -->
        <div class="info-card">
            <div class="info-row">
                <div class="info-icon">🌡️</div>
                <div class="info-content">
                    <span class="info-label">СЕТ в огнището</span>
                    <span class="info-value" id="setValue">--- <small>°C·дни</small></span>
                </div>
            </div>

            <div class="info-row">
                <div class="info-icon">🕐</div>
                <div class="info-content">
                    <span class="info-label">Последно наблюдение</span>
                    <span class="info-value" id="lastUpdated">---</span>
                </div>
            </div>

            <div class="action-row">
                <div id="statusContainer" class="status-badge">
                    <span id="statusIcon">🔄</span>
                    <span id="statusText">Зареждане...</span>
                </div>

                <button class="refresh-btn" onclick="loadSetData(true)">
                    <span>🔄</span> Обнови
                </button>
            </div>
        </div>

        <div class="footer-note">
            Данните се обновяват на всеки 5 мин • БАБРЗ
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Конфигурация
        const CENTER_LAT = 43.571194;
        const CENTER_LNG = 25.310833;
        const RADIUS_KM = 2.5;
        const SUMMARY_URL = 'http://87.254.182.122/summary.json';
        const PROXY_URL = 'https://api.codetabs.com/v1/proxy?quest=';

        // Глобални променливи
        let map, marker, circle;
        let autoRefreshInterval;

        function initMap() {
            map = L.map('map', {
                zoomControl: false, // премахваме големия контрол за мобилно
                attributionControl: false // пестим място
            }).setView([CENTER_LAT, CENTER_LNG], 12);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19
            }).addTo(map);

            // Малък контрол за мащаб долу вдясно
            L.control.zoom({ position: 'bottomright' }).addTo(map);

            // Маркер за огнището
            marker = L.marker([CENTER_LAT, CENTER_LNG], {
                icon: L.divIcon({
                    className: 'custom-marker',
                    html: '<div style="background: #c0392b; width: 20px; height: 20px; border-radius: 50%; border: 3px solid white; box-shadow: 0 2px 8px rgba(0,0,0,0.3);"></div>',
                    iconSize: [26, 26],
                    iconAnchor: [13, 13],
                    popupAnchor: [0, -16]
                })
            }).addTo(map);

            // Карантинна зона
            circle = L.circle([CENTER_LAT, CENTER_LNG], {
                color: '#e07c2c',
                weight: 3,
                fillColor: 'rgba(224, 124, 44, 0.15)',
                fillOpacity: 0.3,
                radius: RADIUS_KM * 1000
            }).addTo(map);

            marker.bindPopup('Зареждане...', {
                className: 'custom-popup',
                closeButton: false
            });

            // Зареждаме данни
            loadSetData(false);
        }

        async function loadSetData(showMessage = false) {
            const statusEl = document.getElementById('statusContainer');
            const statusIcon = document.getElementById('statusIcon');
            const statusText = document.getElementById('statusText');
            const setValueEl = document.getElementById('setValue');
            const lastUpdatedEl = document.getElementById('lastUpdated');

            try {
                statusEl.className = 'status-badge';
                statusIcon.textContent = '🔄';
                statusText.textContent = 'Свързване...';

                const url = PROXY_URL + encodeURIComponent(SUMMARY_URL + '?t=' + Date.now());
                const response = await fetch(url);

                if (!response.ok) throw new Error(`Грешка ${response.status}`);
                
                const data = await response.json();

                if (typeof data.total_sum === 'undefined' || typeof data.last_updated === 'undefined') {
                    throw new Error('Невалидни данни');
                }

                const totalSum = parseFloat(data.total_sum).toFixed(1);
                const lastUpdated = data.last_updated;

                // Форматиране на дата
                let formattedDate = lastUpdated;
                try {
                    const date = new Date(lastUpdated.replace(' ', 'T'));
                    if (!isNaN(date.getTime())) {
                        formattedDate = date.toLocaleString('bg-BG', {
                            day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit'
                        });
                    }
                } catch (e) {}

                setValueEl.innerHTML = `${totalSum} <small>°C·дни</small>`;
                lastUpdatedEl.textContent = formattedDate;

                // Popup съдържание - опростено за мобилно
                const popupContent = `
                    <div style="min-width: 180px; padding: 5px;">
                        <div style="font-weight:700; color:#1b4d3e; border-bottom:2px solid #9bc5b4; padding-bottom:6px; margin-bottom:8px; display:flex; align-items:center; gap:6px;">
                            <span style="background:#1b4d3e; color:white; width:22px; height:22px; display:flex; align-items:center; justify-content:center; border-radius:50%; font-size:0.7rem;">🔥</span>
                            <span style="font-size:0.9rem;">СЕТ Свищов</span>
                        </div>
                        <div style="background:#f0f7f3; padding:8px 10px; border-radius:20px; margin-bottom:5px;">
                            <div style="display:flex; justify-content:space-between;">
                                <span style="color:#1b4d3e;">🌡️ Стойност:</span>
                                <span style="font-weight:700; color:#1b4d3e;">${totalSum} °C·дни</span>
                            </div>
                            <div style="display:flex; justify-content:space-between; font-size:0.7rem; margin-top:5px;">
                                <span style="color:#547a6a;">🕐 ${formattedDate}</span>
                            </div>
                        </div>
                        <div style="font-size:0.65rem; color:#547a6a; text-align:center; border-top:1px dashed #cbdcd0; padding-top:5px;">
                            ⚠️ Зона на карантина 2.5 км
                        </div>
                    </div>
                `;

                marker.setPopupContent(popupContent);

                statusEl.className = 'status-badge connected';
                statusIcon.textContent = '✅';
                statusText.textContent = 'Активна връзка';

                if (showMessage) showToast('Данните са обновени');

            } catch (error) {
                console.error(error);

                setValueEl.innerHTML = '--- <small>°C·дни</small>';
                lastUpdatedEl.textContent = '---';

                statusEl.className = 'status-badge error';
                statusIcon.textContent = '⚠️';
                statusText.textContent = 'Няма връзка';

                marker.setPopupContent(`
                    <div style="padding:10px; text-align:center;">
                        <div style="color:#e07c2c; font-weight:700;">⚠️ Грешка</div>
                        <div style="font-size:0.7rem; margin-top:5px;">Няма връзка с БАБРЗ</div>
                    </div>
                `);

                if (showMessage) showToast('Неуспешна връзка', true);
            }
        }

        function showToast(message, isError = false) {
            const toast = document.createElement('div');
            toast.className = `toast-message ${isError ? 'error' : ''}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        // Инициализация
        document.addEventListener('DOMContentLoaded', () => {
            initMap();
            autoRefreshInterval = setInterval(() => loadSetData(false), 300000);
        });

        window.addEventListener('beforeunload', () => {
            if (autoRefreshInterval) clearInterval(autoRefreshInterval);
        });
    </script>
</body>
</html>
