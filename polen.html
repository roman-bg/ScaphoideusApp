<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Алерго Мет - Твоят съветник за разходка</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&display=swap');
        body { font-family: 'Manrope', sans-serif; background-color: #f0f2f5; }
        .main-card { border-radius: 2rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="pb-10">

    <header class="bg-indigo-950 text-white p-6 sticky top-0 z-50 rounded-b-[2rem] shadow-xl">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-800 tracking-tighter">🤧 Алерго <span class="text-emerald-400">Мет</span></h1>
                <p class="text-[10px] uppercase font-bold opacity-60">Какъв е въздухът днес?</p>
            </div>
            <button onclick="fetchData()" class="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center transition active:scale-90">
                <i class="fa-solid fa-sync-alt"></i>
            </button>
        </div>
    </header>

    <main id="app" class="max-w-md mx-auto p-4 space-y-5">
        
        <section class="bg-emerald-500 text-white p-6 rounded-[2rem] shadow-lg">
            <h3 class="font-800 text-sm mb-1 uppercase tracking-wider">🗓️ Мартенски отчет:</h3>
            <p class="text-xs font-600 opacity-90 leading-relaxed">
                В момента е сезонът на <strong>Брезата и Ясена</strong>. 
                <br>❌ <strong>Липите НЕ цъфтят в момента</strong> (чакаме ги юни).
            </p>
        </section>

        <div id="loader" class="flex flex-col items-center justify-center py-20">
            <div class="w-8 h-8 border-4 border-emerald-200 border-t-emerald-600 rounded-full animate-spin"></div>
            <p class="mt-4 font-800 text-slate-400 text-[10px] uppercase tracking-widest">Проверка на станциите...</p>
        </div>

        <div id="data-list" class="space-y-6 hidden">
            </div>

    </main>

    <script>
        const API = 'https://treebombs.xyz/api.php';

        async function fetchData() {
            const list = document.getElementById('data-list');
            const loader = document.getElementById('loader');
            try {
                const res = await fetch(API);
                const data = await res.json();
                loader.style.display = 'none';
                list.classList.remove('hidden');
                list.innerHTML = '';

                data.forEach(item => {
                    const status = getSimpleStatus(item.stats.t, item.stats.h, item.stats.w);
                    const card = document.createElement('div');
                    card.className = `main-card bg-white p-6 border-b-[8px] ${status.border} overflow-hidden transition transform hover:scale-[1.01]`;
                    
                    card.innerHTML = `
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <h2 class="text-2xl font-800 text-slate-800 leading-none">${item.region}</h2>
                                <p class="text-xs font-800 ${status.textClass} uppercase mt-2 tracking-widest">${status.label}</p>
                            </div>
                            <div class="text-4xl">${status.emoji}</div>
                        </div>

                        <p class="text-sm font-700 text-slate-600 mb-6 leading-snug">
                            ${status.message}
                        </p>

                        <div class="grid grid-cols-3 gap-2 bg-slate-50 p-4 rounded-2xl">
                            <div class="text-center">
                                <span class="block text-[8px] uppercase font-800 text-slate-400">Вятър</span>
                                <span class="text-sm font-800 text-slate-700">${status.windDesc}</span>
                            </div>
                            <div class="text-center border-x border-slate-200">
                                <span class="block text-[8px] uppercase font-800 text-slate-400">Въздух</span>
                                <span class="text-sm font-800 text-slate-700">${status.humDesc}</span>
                            </div>
                            <div class="text-center">
                                <span class="block text-[8px] uppercase font-800 text-slate-400">Вън</span>
                                <span class="text-sm font-800 text-slate-700">${item.stats.t}°C</span>
                            </div>
                        </div>
                    `;
                    list.appendChild(card);
                });
            } catch (e) {
                loader.innerHTML = `<p class="text-red-500 font-bold">Грешка при връзката.</p>`;
            }
        }

        function getSimpleStatus(t, h, w) {
            // КОНСЕРВАТИВНА ЛОГИКА - Само за обикновени хора
            const isWindy = w > 18;
            const isDry = h < 40;

            if (isWindy && isDry) {
                return {
                    label: "ИМАЙТЕ ЕДНО НА УМ",
                    message: "Вятърът разнася прашец от брези. Ако сте алергични, измийте лицето си след прибиране.",
                    emoji: "⚠️", border: "border-amber-400", textClass: "text-amber-600",
                    windDesc: "Силен", humDesc: "Сух"
                };
            }
            
            return {
                label: "БЕЗОПАСНО ЗА РАЗХОДКА",
                message: "Въздухът е спокоен. Полените са ниско до земята и няма опасност за алергичните.",
                emoji: "✅", border: "border-emerald-500", textClass: "text-emerald-600",
                windDesc: "Слаб", humDesc: "Приятен"
            };
        }

        fetchData();
    </script>
</body>
</html>
