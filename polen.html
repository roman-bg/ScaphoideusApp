<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Агро Мет - Алергии</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-indigo-50 min-h-screen">

    <header class="bg-indigo-900 text-white p-5 shadow-xl sticky top-0 z-50 rounded-b-3xl">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-black italic tracking-tighter">AGRO MET</h1>
                <p class="text-[10px] font-bold opacity-60 uppercase tracking-widest">Pollen & Allergy Alert</p>
            </div>
            <button onclick="fetchData()" class="bg-indigo-700 w-10 h-10 rounded-full flex items-center justify-center active:rotate-180 transition-transform duration-500">
                <i class="fa-solid fa-sync-alt"></i>
            </button>
        </div>
    </header>

    <main id="app" class="max-w-md mx-auto p-4 space-y-4">
        <div id="loader" class="flex flex-col items-center justify-center py-20">
            <div class="w-12 h-12 border-4 border-indigo-200 border-t-indigo-900 rounded-full animate-spin"></div>
            <p class="mt-4 font-bold text-indigo-900/40 uppercase text-xs">Синхронизация...</p>
        </div>
    </main>

    <script>
        const API = 'https://treebombs.xyz/api.php';

        async function fetchData() {
            const container = document.getElementById('app');
            try {
                const res = await fetch(API);
                const data = await res.json();
                
                container.innerHTML = '';
                data.forEach(item => {
                    const colors = getRiskUI(item.risk);
                    const card = document.createElement('div');
                    card.className = `bg-white rounded-3xl shadow-sm border-b-4 ${colors.border} overflow-hidden`;
                    card.innerHTML = `
                        <div class="p-5">
                            <div class="flex justify-between items-start mb-4">
                                <h2 class="text-xl font-black text-slate-800">${item.region}</h2>
                                <span class="${colors.bg} ${colors.text} px-3 py-1 rounded-xl text-[10px] font-black uppercase tracking-tighter">
                                    ${item.risk} РИСК
                                </span>
                            </div>
                            <div class="grid grid-cols-3 gap-3">
                                <div class="bg-slate-50 p-3 rounded-2xl text-center">
                                    <i class="fa-solid fa-temperature-half text-orange-400 mb-1"></i>
                                    <p class="text-lg font-black text-slate-700 leading-none">${item.stats.t}°</p>
                                </div>
                                <div class="bg-slate-50 p-3 rounded-2xl text-center">
                                    <i class="fa-solid fa-droplet text-blue-400 mb-1"></i>
                                    <p class="text-lg font-black text-slate-700 leading-none">${item.stats.h}%</p>
                                </div>
                                <div class="bg-slate-50 p-3 rounded-2xl text-center">
                                    <i class="fa-solid fa-wind text-indigo-400 mb-1"></i>
                                    <p class="text-lg font-black text-slate-700 leading-none">${Math.round(item.stats.w)}</p>
                                </div>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (e) {
                container.innerHTML = '<p class="text-center p-10 text-red-400 font-bold">Грешка при връзката с HTTPS сървъра.</p>';
            }
        }

        function getRiskUI(risk) {
            if (risk === 'Екстремен') return { bg: 'bg-red-600', text: 'text-white', border: 'border-red-600' };
            if (risk === 'Висок') return { bg: 'bg-orange-400', text: 'text-white', border: 'border-orange-400' };
            return { bg: 'bg-emerald-100', text: 'text-emerald-700', border: 'border-emerald-200' };
        }

        fetchData();
    </script>
</body>
</html>
