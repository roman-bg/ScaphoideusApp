<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>АЛЕРГО МЕТ | Индикатор на полени</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .glass-card { background: white; border-radius: 24px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); border: 1px solid #e2e8f0; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; }
    </style>
</head>
<body class="pb-10">

    <header class="bg-[#1e293b] text-white p-5 sticky top-0 z-50 shadow-lg border-b border-sky-500/30">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-xl font-800 tracking-tight italic">АЛЕРГО <span class="text-sky-400">МЕТ</span></h1>
            <div class="flex gap-3">
                <span class="text-[10px] font-bold bg-white/10 px-3 py-1 rounded-full flex items-center">LIVE: БГТОЛ СЕНЗОРИ</span>
                <button onclick="fetchData()" class="text-sky-400 active:rotate-180 transition-transform duration-500">
                    <i class="fa-solid fa-sync-alt text-lg"></i>
                </button>
            </div>
        </div>
    </header>

    <main id="app" class="max-w-md mx-auto p-4 space-y-4">
        
        <div class="bg-white p-4 rounded-3xl border border-slate-200 flex items-center gap-4">
            <div class="bg-amber-100 p-3 rounded-2xl text-amber-600">
                <i class="fa-solid fa-tree text-xl"></i>
            </div>
            <div class="text-[11px] font-700 text-slate-600 leading-tight">
                <span class="text-slate-900 block uppercase mb-1">Текущ риск:</span>
                Топола, Бреза, Ясен. (Липата не е активна).
            </div>
        </div>

        <div id="loader" class="py-20 text-center italic text-slate-400 text-xs">Зареждане на данни...</div>
        <div id="data-list" class="space-y-4 hidden"></div>

    </main>

    <script>
        const API = 'https://treebombs.xyz/api.php';

        async function fetchData() {
            const list = document.getElementById('data-list');
            const loader = document.getElementById('loader');
            try {
                const res = await fetch(API);
                const data = await res.json();
                loader.style.display = 'none';
                list.classList.remove('hidden');
                list.innerHTML = '';

                data.forEach(item => {
                    const ui = getLogic(item.stats.t, item.stats.h, item.stats.w);
                    const card = document.createElement('div');
                    card.className = `glass-card p-5 border-l-8 ${ui.borderColor}`;
                    
                    card.innerHTML = `
                        <div class="flex justify-between items-center mb-4">
                            <div>
                                <h2 class="text-lg font-800 text-slate-800">${item.region}</h2>
                                <div class="flex items-center gap-2 mt-0.5">
                                    <div class="status-dot ${ui.dotColor} animate-pulse"></div>
                                    <span class="text-[10px] font-800 uppercase tracking-widest ${ui.textColor}">${ui.label}</span>
                                </div>
                            </div>
                            <div class="bg-slate-50 px-3 py-1 rounded-xl border border-slate-100 text-[11px] font-800 text-slate-500">
                                ${item.stats.t}°C
                            </div>
                        </div>

                        <p class="text-xs font-600 text-slate-600 leading-relaxed mb-4 italic">
                            "${ui.message}"
                        </p>

                        <div class="flex gap-6 border-t border-slate-50 pt-4">
                            <div>
                                <span class="block text-[8px] uppercase font-800 text-slate-400 mb-0.5">Вятър</span>
                                <span class="text-xs font-800 text-slate-700 italic">${item.stats.w} km/h</span>
                            </div>
                            <div>
                                <span class="block text-[8px] uppercase font-800 text-slate-400 mb-0.5">Влажност</span>
                                <span class="text-xs font-800 text-slate-700 italic">${item.stats.h}%</span>
                            </div>
                        </div>
                    `;
                    list.appendChild(card);
                });
            } catch (e) {
                loader.innerHTML = `Грешка при връзката.`;
            }
        }

        function getLogic(t, h, w) {
            // Реални прагове за алергични
            const isDanger = w > 25 && h < 35;
            const isWarning = w > 15 || h < 45;

            if (isDanger) return {
                label: "Висок Риск", message: "Силният вятър и сушата разнасят големи количества полен.",
                borderColor: "border-red-500", textColor: "text-red-600", dotColor: "bg-red-500"
            };
            if (isWarning) return {
                label: "Повишен Риск", message: "Условията са благоприятни за летене на топола и бреза.",
                borderColor: "border-amber-400", textColor: "text-amber-600", dotColor: "bg-amber-400"
            };
            return {
                label: "Нисък Риск", message: "Въздухът е спокоен. Полените не са активни.",
                borderColor: "border-emerald-500", textColor: "text-emerald-600", dotColor: "bg-emerald-500"
            };
        }

        fetchData();
    </script>
</body>
</html>
